name: Publish container image

# Publishing happens here, in CI, and never from a maintainer's machine — the
# only credential involved is the workflow's own GITHUB_TOKEN (ADR-046 §2).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (e.g. v0.24.0)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      # write: attaches the SBOM to the tag's GitHub Release.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The release-line check below asks which branches contain the tag.
          # The default shallow checkout fetches the tag alone and creates no
          # remote-tracking branches, so that question has no answer and
          # `latest` would never move.
          fetch-depth: 0

      - name: Resolve version and release line
        id: resolve
        run: |
          set -euo pipefail
          GIT_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${GIT_TAG#v}"
          FILE_VERSION="$(cat VERSION)"

          # A tag that disagrees with the VERSION file would publish an image
          # whose About modal contradicts its own tag.
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GIT_TAG implies version $VERSION but VERSION says $FILE_VERSION"
            exit 1
          fi

          # `latest` tracks the current release line only. Pointing it at main
          # would hand unfinished work to anyone who omitted a tag (ADR-046 §2).
          # Not masked with `|| true`: an empty result must mean "the tag is on
          # no release branch", never "the lookup failed", or a broken checkout
          # would silently degrade into skipping `latest`.
          BRANCHES="$(git branch -r --contains "$GIT_TAG")"
          if echo "$BRANCHES" | grep -q "origin/release/"; then
            echo "publish_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Busts the cached apt-get upgrade layer once a day (see the Dockerfile).
      # Both builds below pass the same key, so the push reuses the scanned one.
      - name: Security refresh key
        id: refresh
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and scan before anything is pushed: an image that fails the scan
      # never reaches GHCR. The push below reuses this build from the cache.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wayfinder:scan
          build-args: SECURITY_REFRESH=${{ steps.refresh.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same bar as the CI docker-image job: fixable HIGH/CRITICAL blocks the
      # release; waivers live in .trivyignore with their justification.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wayfinder:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wayfinder:scan
          format: cyclonedx
          output: wayfinder-${{ steps.resolve.outputs.version }}.cdx.json
          skip-setup-trivy: true

      - name: Upload SBOM as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.resolve.outputs.version }}
          path: wayfinder-${{ steps.resolve.outputs.version }}.cdx.json

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Also attaches BuildKit's own SBOM as an attestation on the pushed
          # image, so registry-side scanners can read it without the release.
          sbom: true
          build-args: SECURITY_REFRESH=${{ steps.refresh.outputs.date }}
          tags: |
            ghcr.io/rbrasier/wayfinder:${{ steps.resolve.outputs.version }}
            ${{ steps.resolve.outputs.publish_latest == 'true' && 'ghcr.io/rbrasier/wayfinder:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Release is created by /publish after the tag is pushed, so on a tag
      # push it may not exist yet. Then the SBOM stays on the workflow run, and
      # /publish attaches it when it fills in the digest.
      - name: Attach SBOM to the GitHub Release
        id: sbom
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GIT_TAG: v${{ steps.resolve.outputs.version }}
          SBOM_FILE: wayfinder-${{ steps.resolve.outputs.version }}.cdx.json
        run: |
          if ! gh release view "$GIT_TAG" > /dev/null 2>&1; then
            echo "::notice title=SBOM not attached::No GitHub Release for $GIT_TAG yet; the SBOM is on this run's artifacts."
            echo "attached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release upload "$GIT_TAG" "$SBOM_FILE" --clobber
          echo "attached=true" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          {
            echo "### Published \`ghcr.io/rbrasier/wayfinder\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.resolve.outputs.version }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Moved \`latest\` | ${{ steps.resolve.outputs.publish_latest }} |"
            echo "| SBOM on Release | ${{ steps.sbom.outputs.attached }} |"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/rbrasier/wayfinder:${{ steps.resolve.outputs.version }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
