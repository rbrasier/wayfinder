# Dependabot — security updates for the lockfile, version updates for the
# things pinned by hand (action SHAs, the base image) so they do not rot.
#
# npm version updates are off (limit 0): routine bumps are taken deliberately,
# not as a stream of PRs. Security updates ignore that limit and still open,
# once "Dependabot security updates" is enabled in the repository's Code
# security settings. GitHub always opens security updates against the default
# branch, whatever `target-branch` says — and setting `target-branch` on an
# entry stops its settings (the security group below) applying to them — so the
# npm entry carries none. workflows/dependabot-release-port.yml rebuilds each
# non-major security PR on the current release branch and closes the `main` one.
# workflows/dependabot-version-bump.yml adds a PATCH bump to every other
# Dependabot PR (the port commit carries its own), and /fixbot fixes the
# ones whose CI goes red.
#
# Version updates are fixes, so they open against the current release branch.
# Every `target-branch` must equal the `Current release branch:` pointer in
# CLAUDE.md — validate.sh section 25 enforces it, and /release moves both when a
# new line is cut. Dependabot reads this file from `main` only, so a change here
# takes effect once it is forward-merged.
#
# Every entry waits 7 days before proposing a newly published version, so a
# compromised or broken release has time to be pulled before it reaches a PR.
# Security updates are not delayed by it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: release/alpha-2
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Majors are a Node runtime upgrade, taken deliberately rather than by bot.
  - package-ecosystem: docker
    directory: /
    target-branch: release/alpha-2
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
