# Wayfinder on one host: web, api, Postgres and object storage.
#
#   cp .env.min.example.prod .env      # then fill in the secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# To upgrade, change WAYFINDER_VERSION and repeat the `up -d`. Migrations run
# automatically as their own service before the app starts — see
# docs/guides/upgrading.md.
#
# This is NOT docker-compose.yml. That file runs infrastructure only, for local
# development against a host-run app, and ./restart.sh depends on it.

name: wayfinder

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/wayfinder
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?generate with openssl rand -hex 32}
  SCHEDULER_TICK_SECRET: ${SCHEDULER_TICK_SECRET:?generate with openssl rand -hex 32}
  # Migrations are the migrate service's job, never a side effect of app boot.
  RUN_MIGRATIONS_ON_START: "false"
  # Bundled MinIO. These are this file's own credentials rather than anything the
  # operator chose, so presetting them costs no security and saves an evaluator
  # from pasting them into the setup wizard. Every other integration — AI
  # provider, mail, sign-in — is left for the wizard, which tests each connection
  # before accepting it.
  MINIO_ENDPOINT: storage
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_PATH_STYLE: "true"
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-wayfinder-documents}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wayfinder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wayfinder"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SeaweedFS, not MinIO: MinIO's images are no longer served. The flags are the
  # same as docker-compose.yml, which explains each one. Nothing is published —
  # only the app services reach it, on the compose network.
  #
  # Upgrading from a MinIO-based release: SeaweedFS cannot read MinIO's data.
  # Migrate the objects before relying on this — docs/guides/upgrading.md.
  storage:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    command: server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -s3 -s3.port=9000 -master.volumeSizeLimitMB=1024 -volume.max=0 -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs to completion on every `up`, including every upgrade, then exits. The
  # app services wait for it, so they never start against an unmigrated schema.
  # Safe to run concurrently and safe to re-run: it takes an advisory lock and an
  # already-current database is a no-op.
  migrate:
    image: ghcr.io/rbrasier/wayfinder:${WAYFINDER_VERSION:-latest}
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment

  web:
    image: ghcr.io/rbrasier/wayfinder:${WAYFINDER_VERSION:-latest}
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    environment:
      <<: *app-environment
      WEB_PORT: "3000"
      # Sign-in callbacks, the first-run /setup link and notification email links
      # are all built from this, so the localhost default breaks a real host.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set to the public origin, no trailing slash}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?generate with openssl rand -hex 32}
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Trust anchors for the built-in signature engine (ADR-069 §5): the CA
    # certificates your signers' digital IDs chain to, PEM or DER. Deployment
    # configuration, never an admin setting.
    volumes:
      - ./trust:/app/trust:ro

  api:
    image: ghcr.io/rbrasier/wayfinder:${WAYFINDER_VERSION:-latest}
    command: ["api"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    environment:
      <<: *app-environment
      API_PORT: "3001"
      # The scheduler heartbeat POSTs the web app's internal tick endpoint.
      WEB_BASE_URL: http://web:3000

  # Optional external PDF converter (ADR-067 §3). The default Wayfinder image
  # converts documents itself (ADR-069), so this is only for installs that run
  # the -slim image or prefer a separate service:
  #   docker compose -f docker-compose.prod.yml --profile pdf up -d
  # then set Settings → PDF signatures → PDF converter to External,
  # http://gotenberg:3000. Not published: only the app talks to it.
  gotenberg:
    image: gotenberg/gotenberg:8.25.0@sha256:e304e45acee3c400f8ef76afa195c76b1d0eaf0ab6fe9651e305067ab6a1560c
    restart: unless-stopped
    profiles: ["pdf"]

  # Optional external signature engine (ADR-067 §4). The default Wayfinder image
  # carries the same engine built in (ADR-069), so this is only for installs
  # that run the -slim image or prefer a separate service:
  #   docker compose -f docker-compose.prod.yml --profile pdf --profile signing up -d
  # then set Settings → PDF signatures → Signature engine to External,
  # http://dss:8080.
  # Trust anchors are deployment configuration, never an admin setting: put the
  # CA certificates your signers' digital IDs chain to in ./trust (PEM or DER).
  dss:
    image: ghcr.io/rbrasier/wayfinder-dss:${WAYFINDER_VERSION:-latest}
    restart: unless-stopped
    profiles: ["signing"]
    volumes:
      - ./trust:/trust:ro

# minio-data is deliberately no longer declared, so `docker compose down -v`
# cannot delete a MinIO volume that has not been migrated yet.
volumes:
  postgres-data:
  seaweedfs-data:
