services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wayfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wayfinder
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SeaweedFS in single-process mode — master, volume server, filer and S3
  # gateway in one container. MinIO's images are no longer served (see
  # object-storage-image.test.ts); the app's S3 client is unchanged and still
  # reads MINIO_ACCESS_KEY / MINIO_SECRET_KEY, so this server takes the same
  # values. Only the S3 port is published.
  #
  # -ip=127.0.0.1: the components address each other inside this container, and
  #   the container's own IP changes whenever it is recreated.
  # -ip.bind=0.0.0.0: without it the listeners bind only to -ip, so neither the
  #   published port nor the healthcheck could reach S3.
  # 1 GB volumes, count sized from free disk: the defaults (30 GB, at most 8) can
  #   leave a small disk with no room to create a volume at all.
  # -master.telemetry=false: SeaweedFS otherwise reports usage to its maintainers.
  storage:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: wayfinder-storage
    restart: unless-stopped
    command: server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -s3 -s3.port=9000 -master.volumeSizeLimitMB=1024 -volume.max=0 -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  langfuse:
    image: langfuse/langfuse:2
    container_name: wayfinder-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3030:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3030
      NEXTAUTH_SECRET: replace-me
      SALT: replace-me
      TELEMETRY_ENABLED: "false"

  # PDF converter for "Convert to PDF on signing" and certificate signatures
  # (ADR-067 §3). Opt-in: `docker compose --profile pdf up -d`, then set
  # Settings → PDF signatures → PDF converter URL to http://localhost:3100.
  gotenberg:
    image: gotenberg/gotenberg:8.25.0@sha256:e304e45acee3c400f8ef76afa195c76b1d0eaf0ab6fe9651e305067ab6a1560c
    container_name: wayfinder-gotenberg
    restart: unless-stopped
    profiles: ["pdf"]
    ports:
      - "3100:3000"

# minio-data is deliberately no longer declared: SeaweedFS cannot read MinIO's
# on-disk format, and leaving the old volume undeclared keeps
# `docker compose down -v` from deleting it before it has been migrated (see
# docs/guides/upgrading.md).
volumes:
  postgres-data:
  seaweedfs-data:
